<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>容器镜像同步</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .card {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 16px;
      padding: 2.5rem;
      width: 100%;
      max-width: 560px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 0.25rem;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 0.4rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    input {
      width: 100%;
      padding: 0.7rem 0.9rem;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    input::placeholder { color: #475569; }

    input:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }

    .hint {
      font-size: 0.75rem;
      color: #64748b;
      margin-top: 0.3rem;
    }

    button {
      width: 100%;
      padding: 0.75rem;
      background: linear-gradient(135deg, #3b82f6, #6366f1);
      color: #fff;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 0.5rem;
    }

    button:hover { opacity: 0.9; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }

    #result {
      margin-top: 1.25rem;
      padding: 0.8rem 1rem;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.5;
      display: none;
      word-break: break-all;
    }

    #result.success {
      display: block;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    #result.error {
      display: block;
      background: rgba(239, 68, 68, 0.12);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
    }

    #result.loading {
      display: block;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: #7dd3fc;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🐳 容器镜像同步</h1>
    <p class="subtitle">将 Docker Hub / quay.io 镜像同步至华为云 SWR</p>

    <form id="syncForm" autocomplete="off">
      <div class="form-group">
        <label for="source">源镜像地址 *</label>
        <input type="text" id="source" name="source"
               placeholder="docker.io/library/nginx:1.25.3"
               required />
        <div class="hint">支持 Docker Hub 和 quay.io，格式：registry/org/image:tag</div>
      </div>

      <div class="form-group">
        <label for="destination">目标镜像地址 *</label>
        <input type="text" id="destination" name="destination"
               placeholder="swr.cn-north-4.myhuaweicloud.com/your-org/nginx:1.25.3"
               required />
        <div class="hint">仅支持华为云 SWR 地址</div>
      </div>

      <div class="form-group">
        <label for="tags">同步 Tags（可选）</label>
        <input type="text" id="tags" name="tags"
               placeholder="留空同步全部 tag，或输入 1.25.3,1.24.0" />
        <div class="hint">逗号分隔多个 tag；留空或输入 all 同步全部</div>
      </div>

      <button type="submit" id="submitBtn">触发同步</button>
    </form>

    <div id="result"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
