name = "image-sync-proxy"
main = "index.js"
compatibility_date = "2025-06-01"

# 静态资源：同一个 Worker 直接托管 ../web 下的前端页面（同源，无 CORS）
[assets]
directory = "../web"

# 环境变量（在 Cloudflare 上通过 `wrangler secret put` 设置）：
#   GITHUB_REPO     仓库 owner/repo
#   WORKFLOW_ID     工作流文件名，如 sync-images.yml
#   GITHUB_TOKEN    Fine-grained Token（Contents / Actions / Workflows 读写）
#   APP_PASSWORD    前端访问口令（登录后才能调用 API）
#   SWR_REGISTRY    可选，默认 swr.cn-east-4.myhuaweicloud.com
#   SWR_ORG         可选，默认 ascend-sync
#   ALLOWED_ORIGIN  可选，前端域名（同源部署时无需设置）

# 本地调试：
#   wrangler dev
