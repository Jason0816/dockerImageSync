name: Sync Container Images
run-name: Sync ${{ inputs.source }} → ${{ inputs.destination }} [${{ inputs.arch == 'all' && 'amd64+arm64' || (inputs.arch || 'amd64') }}]

on:
  workflow_dispatch:
    inputs:
      source:
        description: '源镜像地址（可带 tag），如 docker.io/library/nginx:1.25.3 或 quay.io/prometheus/node-exporter:v1.7.0'
        required: true
        type: string
      destination:
        description: '目标镜像地址，如 swr.cn-east-4.myhuaweicloud.com/your-org/nginx:1.25.3'
        required: true
        type: string
      tags:
        description: '可选：逗号分隔 tag 列表。留空时：源地址带 tag 则只同步该 tag，不带 tag 则同步全部 tag；填 all 强制同步全部 tag'
        required: false
        type: string
        default: ''
      arch:
        description: '同步的 CPU 架构：amd64 / arm64 / all（全部平台 = 仅 amd64 + arm64）'
        required: false
        type: string
        default: 'amd64'
      public:
        description: '同步完成后是否把镜像设为公开：true / false（默认 true）'
        required: false
        type: string
        default: 'true'
      stall_timeout:
        description: '无进展判定阈值（分钟）：连续这么久没有新层完成就自动终止（默认 30；超大镜像可调大）'
        required: false
        type: string
        default: '30'

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate images.yaml from inputs
        shell: bash
        run: |
          SOURCE="${{ github.event.inputs.source }}"
          DESTINATION="${{ github.event.inputs.destination }}"
          TAGS="${{ github.event.inputs.tags }}"

          echo "Generating images.yaml..."
          echo "  Source:      $SOURCE"
          echo "  Destination: $DESTINATION"
          echo "  Tags:        ${TAGS:-(auto)}"

          # 去掉地址末尾的 tag（保留 registry 端口，如 registry:5000/org/img）
          strip_tag() {
            local addr="$1"
            if [[ "$addr" =~ ^([^:]+):([^:/]+)$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo "$addr"
            fi
          }

          # 提取地址中已有的 tag，没有则输出空串
          extract_tag() {
            local addr="$1"
            if [[ "$addr" =~ ^[^:]+:([^:/]+)$ ]]; then
              echo "${BASH_REMATCH[1]}"
            else
              echo ""
            fi
          }

          SOURCE_BASE=$(strip_tag "$SOURCE")
          DEST_BASE=$(strip_tag "$DESTINATION")
          SOURCE_TAG=$(extract_tag "$SOURCE")

          if [ "$TAGS" = "all" ]; then
            # 1) 显式 all：强制同步全部 tag（忽略源地址里的 tag）
            echo "Mode: all tags (forced)"
            printf '%s: %s\n' "$SOURCE_BASE" "$DEST_BASE" > images.yaml
          elif [ -n "$TAGS" ]; then
            # 2) 显式指定 tag 列表
            echo "Mode: explicit tags ($TAGS)"
            : > images.yaml
            IFS=',' read -ra TAG_ARRAY <<< "$TAGS"
            for tag in "${TAG_ARRAY[@]}"; do
              tag=$(echo "$tag" | xargs)  # trim whitespace
              [ -z "$tag" ] && continue
              printf '%s:%s: %s:%s\n' "$SOURCE_BASE" "$tag" "$DEST_BASE" "$tag" >> images.yaml
            done
          elif [ -n "$SOURCE_TAG" ]; then
            # 3) 源地址自带 tag 且未指定 tags：只同步这个 tag（默认行为）
            echo "Mode: single tag from source address ($SOURCE_TAG)"
            printf '%s:%s: %s:%s\n' "$SOURCE_BASE" "$SOURCE_TAG" "$DEST_BASE" "$SOURCE_TAG" > images.yaml
          else
            # 4) 源地址不带 tag 且未指定 tags：同步全部 tag
            echo "Mode: all tags"
            printf '%s: %s\n' "$SOURCE_BASE" "$DEST_BASE" > images.yaml
          fi

          echo "--- Generated images.yaml ---"
          cat images.yaml
          echo "-----------------------------"

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          {
            echo "### 同步规则"
            echo '```yaml'
            cat images.yaml 2>/dev/null || echo "(未生成)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run image-syncer
        shell: bash
        env:
          SWR_USERNAME: ${{ secrets.SWR_USERNAME }}
          SWR_PASSWORD: ${{ secrets.SWR_PASSWORD }}
          SOURCE_DOCKERHUB_USER: ${{ secrets.SOURCE_DOCKERHUB_USER }}
          SOURCE_DOCKERHUB_PASS: ${{ secrets.SOURCE_DOCKERHUB_PASS }}
          SOURCE_QUAY_USER: ${{ secrets.SOURCE_QUAY_USER }}
          SOURCE_QUAY_PASS: ${{ secrets.SOURCE_QUAY_PASS }}
        run: |
          set -euo pipefail

          ARCH="${{ github.event.inputs.arch }}"
          if [ -z "$ARCH" ]; then
            ARCH="amd64"
          fi

          VERSION="v1.5.5"
          echo "Downloading image-syncer ${VERSION} ..."
          curl -fsSL -o image-syncer.tar.gz \
            "https://github.com/AliyunContainerService/image-syncer/releases/download/${VERSION}/image-syncer-${VERSION}-linux-amd64.tar.gz"
          tar -xzf image-syncer.tar.gz image-syncer
          chmod +x image-syncer

          ARGS=(--auth=./auth.yaml --images=./images.yaml --os=linux --proc=6 --retries=2)
          # --arch 是 stringArray，可传多个。
          # 「全部平台」(all) 只同步 amd64 + arm64，不同步 386/ppc64le/riscv64/s390x 等，
          # 因为这些平台在华为云 SWR 场景基本用不到，全量会显著拖慢同步。
          case "$ARCH" in
            all)
              ARGS+=(--arch=amd64 --arch=arm64)
              echo "Arch filter: amd64 + arm64 (全部平台仅这两个)"
              ;;
            *)
              ARGS+=(--arch="$ARCH")
              echo "Arch filter: $ARCH"
              ;;
          esac

          # 无进展判定阈值（分钟）。注意：单个超大层（如 4GB）正常传输可能需要 20 分钟
          # 而没有新日志，所以阈值必须留足余量，默认 30 分钟。
          STALL_MINUTES="${{ github.event.inputs.stall_timeout }}"
          if ! [[ "${STALL_MINUTES:-}" =~ ^[0-9]+$ ]] || [ "${STALL_MINUTES:-0}" -lt 5 ]; then
            STALL_MINUTES=30
          fi
          echo "无进展判定阈值: ${STALL_MINUTES} 分钟"

          LOG=syncer.log
          : > "$LOG"

          set +e
          ./image-syncer "${ARGS[@]}" >> "$LOG" 2>&1 &
          SYNC_PID=$!
          tail -n +1 -f "$LOG" 2>/dev/null &
          TAIL_PID=$!

          last_size=-1
          last_change=$(date +%s)
          last_beat=0
          stalled=0

          while kill -0 "$SYNC_PID" 2>/dev/null; do
            sleep 15
            size=$(stat -c%s "$LOG" 2>/dev/null || echo 0)
            now=$(date +%s)
            if [ "$size" != "$last_size" ]; then
              last_size=$size
              last_change=$now
              last_beat=0
              continue
            fi
            idle=$(( (now - last_change) / 60 ))
            if [ "$idle" -ge "$STALL_MINUTES" ]; then
              stalled=1
              break
            fi
            if [ "$idle" -gt "$last_beat" ] && [ $(( idle % 5 )) -eq 0 ]; then
              last_beat=$idle
              echo "… 已 ${idle} 分钟没有新层完成（阈值 ${STALL_MINUTES} 分钟），仍在传输中"
            fi
          done

          if [ "$stalled" = "1" ]; then
            kill -TERM "$SYNC_PID" 2>/dev/null
            sleep 5
            kill -KILL "$SYNC_PID" 2>/dev/null
          fi
          wait "$SYNC_PID"
          syncer_status=$?
          kill "$TAIL_PID" 2>/dev/null
          wait "$TAIL_PID" 2>/dev/null
          set -e

          if [ "$stalled" = "1" ]; then
            {
              echo "### ❌ 同步无进展，已自动终止"
              echo ""
              echo "连续 **${STALL_MINUTES} 分钟**没有任何新层完成，判定为传输卡死（与镜像大小无关，是链路停住）。"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 源镜像 | \`${{ github.event.inputs.source }}\` |"
              echo "| 阈值 | ${STALL_MINUTES} 分钟 |"
              echo ""
              echo "**已完成的层会保留在 SWR 中**，直接重跑会跳过它们、只补剩余的层。"
              echo "若确认是超大镜像（单层超过 10GB）本身传输慢，可在手动触发时把 \`stall_timeout\` 调大。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=同步无进展::连续 ${STALL_MINUTES} 分钟无新层完成，已终止。已完成的层会保留，可直接重跑。"
            exit 1
          fi

          # image-syncer 在「镜像没有匹配平台」时会跳过并以 0 退出，必须显式判定，
          # 否则 Actions 显示成功但 SWR 里什么都没有。
          if grep -q 'no manifest fits' "$LOG"; then
            skipped=$(grep -c 'no manifest fits' "$LOG" || true)
            {
              echo "### ❌ 架构不匹配，已跳过同步"
              echo ""
              echo "镜像没有提供 **${ARCH}** 平台的 manifest，image-syncer 已跳过（共有 ${skipped} 条规则被跳过）。"
              echo ""
              echo "| 项 | 值 |"
              echo "|---|---|"
              echo "| 源镜像 | \`${{ github.event.inputs.source }}\` |"
              echo "| 目标架构 | \`${ARCH}\` |"
              echo ""
              echo "**SWR 中不会出现对应镜像。** 该镜像实际支持的架构可用 \`docker manifest inspect <源镜像>\` 查看，然后在页面上把「目标架构」改成一致的值再重新触发。"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=架构不匹配::镜像没有提供 ${ARCH} 平台的 manifest，已跳过同步（SWR 中不会有该镜像）。请切换目标架构后重试。"
            exit 1
          fi

          # 非「架构不匹配」的失败：交给分类脚本输出中文原因（地址写错 / 不存在 / 限流 / 网络）
          if [ "$syncer_status" != "0" ]; then
            python3 scripts/classify_sync_failure.py --log "$LOG" \
              --source "${{ github.event.inputs.source }}" --arch "$ARCH" || true
            exit "$syncer_status"
          fi

          exit 0

      - name: Set SWR repositories public
        if: success() && github.event.inputs.public != 'false'
        shell: bash
        continue-on-error: true
        env:
          SWR_AK: ${{ secrets.SWR_AK }}
          SWR_SK: ${{ secrets.SWR_SK }}
          SWR_PROJECT_ID: ${{ secrets.SWR_PROJECT_ID }}
        run: |
          DESTINATIONS=$(grep -v '^[[:space:]]*#' images.yaml \
            | sed '/^[[:space:]]*$/d' \
            | awk -F': ' '{print $2}' \
            | paste -sd, -)
          echo "目标仓库: ${DESTINATIONS}"
          python3 -m pip install --quiet --disable-pip-version-check huaweicloudsdkcore huaweicloudsdkswr
          SWR_DESTINATIONS="$DESTINATIONS" python3 scripts/make_repo_public.py
